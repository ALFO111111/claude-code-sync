name: 功能建议 / Feature request
description: 想要的新功能或改进 / Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到的问题 / The problem
      description: 现在哪里不方便？/ What's inconvenient today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 希望怎么解决 / Proposed solution
