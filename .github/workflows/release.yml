# 发布：推送 v 开头的标签（如 v0.3.0、v0.3.0-beta.1）时自动构建并发布到 GitHub Releases。
#
#   1. CHANGELOG.md 里把 [Unreleased] 改成 [0.3.0] - 日期，提交
#   2. git tag -a v0.3.0 -m v0.3.0 && git push github v0.3.0
#
# Windows 和 macOS 分别在各自的系统上编译（Wails 的 Mac 版要用 Xcode 工具链），最后合到一个 Release 里。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # 创建 Release、上传文件

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
          - os: macos-latest
            platform: darwin/universal # 一个 App 同时支持 Intel 和 Apple 芯片
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Version from tag
        id: ver
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # exe / App 属性里的版本号只能是纯数字 x.y.z，去掉 -beta.1 之类的后缀
          echo "numeric=$(echo "$v" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...

      - name: Install Wails CLI (same version as go.mod)
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)

      - name: Build
        shell: bash
        run: |
          # 版本号写进 exe 文件属性（右键 → 属性 → 详细信息）/ App 的 Info.plist
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('wails.json'));j.info.productVersion='${{ steps.ver.outputs.numeric }}';fs.writeFileSync('wails.json',JSON.stringify(j,null,2)+'\n')"
          wails build -clean -trimpath -platform ${{ matrix.platform }} -ldflags "-X main.version=${{ steps.ver.outputs.version }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/bin/claude-code-sync.exe dist/claude-code-sync.exe
          Compress-Archive -Path build/bin/claude-code-sync.exe, LICENSE, README.md, README_EN.md -DestinationPath "dist/claude-code-sync-$v-windows-amd64.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          v='${{ steps.ver.outputs.version }}'
          mkdir dist
          # ditto 打包会保留 .app 里的符号链接和签名，普通 zip 会把 App 弄坏
          ditto -c -k --keepParent build/bin/claude-code-sync.app "dist/claude-code-sync-$v-macos-universal.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        id: ver
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          (cd dist && sha256sum * > ../SHA256SUMS.txt) && mv SHA256SUMS.txt dist/
          cat dist/SHA256SUMS.txt
          # 取 CHANGELOG.md 里 "## [版本号]" 到下一个 "## [" 之间的内容
          awk -v ver="$v" '
            index($0, "## [" ver "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          echo "--- release notes ---"; cat release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/claude-code-sync.exe
            dist/claude-code-sync-${{ steps.ver.outputs.version }}-windows-amd64.zip
            dist/claude-code-sync-${{ steps.ver.outputs.version }}-macos-universal.zip
            dist/SHA256SUMS.txt
