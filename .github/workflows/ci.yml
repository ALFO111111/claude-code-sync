# 每次推送 / PR：格式、静态检查、全部测试、前端文字检查、前端单元测试和构建。
# 测试全部在临时目录里跑（云端用本地文件夹或内存假 S3 代替），不需要任何密钥。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # frontend/wailsjs（前端调后端的代码）由 Wails 根据 internal/gui/app.go 自动生成，不进仓库；
      # 前端构建要引用它，所以先生成。发布流程用 wails build，会自动生成，不需要这一步。
      - name: Generate Wails bindings
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          wails generate module

      - name: Frontend (i18n check + unit tests + build)
        working-directory: frontend
        run: |
          npm ci
          npm run check-i18n
          npm test
          npm run build

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "需要 gofmt / not gofmt-ed:"; echo "$unformatted"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...
